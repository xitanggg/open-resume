$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://openresume.com/schemas/resume-schema.json"
title: OpenResume Resume Schema
description: Complete JSON schema for resume data extracted by OpenResume parser. v1.1.0 removes jobTitle enum constraint to allow full text job titles as extracted from resumes.
version: "1.1.0"
type: object

required: [profile, workExperiences, educations, projects, skills, custom]

properties:
  profile:
    $ref: "#/definitions/ResumeProfile"
  workExperiences:
    type: array
    items:
      $ref: "#/definitions/ResumeWorkExperience"
    description: "Array of work experience entries"
  educations:
    type: array
    items:
      $ref: "#/definitions/ResumeEducation"
    description: "Array of education entries"
  projects:
    type: array
    items:
      $ref: "#/definitions/ResumeProject"
    description: "Array of project entries"
  skills:
    $ref: "#/definitions/ResumeSkills"
  custom:
    $ref: "#/definitions/ResumeCustom"

definitions:
  ResumeProfile:
    type: object
    required: [name, email, phone, url, summary, location]
    properties:
      name:
        type: string
        pattern: "^[a-zA-Z\\s\\.]*$"
        description: "Full name (letters, spaces, periods only)"
        examples: ["John Doe", "Mary Jane Smith", "Dr. James Wilson Jr."]
      email:
        type: string
        pattern: "\\S+@\\S+\\.\\S+"
        description: "Email address with domain validation"
        examples: ["john@example.com", "mary.smith@company.org"]
      phone:
        type: string
        pattern: "\\(?\\d{3}\\)?[\\s-]?\\d{3}[\\s-]?\\d{4}"
        description: "US phone number with flexible formatting"
        examples: ["(555) 123-4567", "555-123-4567", "555 123 4567"]
      url:
        type: string
        description: "Website URL (supports multiple formats)"
        examples: ["linkedin.com/in/user", "https://portfolio.com", "www.github.com/user"]
      summary:
        type: string
        description: "Professional summary or objective statement"
        examples: ["Experienced software engineer with 5+ years in full-stack development"]
      location:
        type: string
        pattern: "[A-Z][a-zA-Z\\s]+, [A-Z]{2}"
        description: "Location in 'City, State' format"
        examples: ["San Francisco, CA", "New York, NY", "Austin, TX"]

  ResumeWorkExperience:
    type: object
    required: [company, jobTitle, date, descriptions]
    properties:
      company:
        type: string
        description: "Company or organization name"
        examples: ["Google Inc.", "Microsoft Corporation", "Startup Co."]
      jobTitle:
        type: string
        description: "Job title as extracted from resume (full text, not constrained to predefined list)"
        examples: ["Senior Software Engineer", "Machine Learning Engineer II", "Full-Stack Developer", "Principal Data Scientist", "Software Development Engineer in Test (SDET)", "Technical Product Manager"]
      date:
        type: string
        description: "Employment dates in flexible format"
        examples: ["Jan 2020 - Present", "2019-2021", "Summer 2020", "2018 - Dec 2020"]
      descriptions:
        type: array
        items:
          type: string
        description: "Job responsibilities and achievements"
        examples: [
          "Developed web applications using React and Node.js",
          "Led team of 5 engineers in agile development process",
          "Improved system performance by 40% through optimization"
        ]

  ResumeEducation:
    type: object
    required: [school, degree, date, gpa, descriptions]
    properties:
      school:
        type: string
        pattern: ".*(College|University|Institute|School|Academy|BASIS|Magnet).*"
        description: "Educational institution name"
        examples: ["Stanford University", "MIT", "Community College of Denver"]
      degree:
        type: string
        pattern: ".*(Associate|Bachelor|Master|PhD|Ph\\.|[ABM][A-Z\\.]*).*"
        description: "Degree type and field of study"
        examples: ["Bachelor of Science in Computer Science", "MBA", "Ph.D. in Physics"]
      date:
        type: string
        description: "Graduation or attendance dates"
        examples: ["May 2020", "2016-2020", "Expected Spring 2024"]
      gpa:
        type: string
        pattern: "([0-4]\\.[0-9]{1,2}|[0-9]{1,3})"
        description: "GPA (0.00-4.99) or percentage grade (≤110)"
        examples: ["3.85", "3.7", "89", "95"]
      descriptions:
        type: array
        items:
          type: string
        description: "Academic achievements and activities"
        examples: [
          "Magna Cum Laude",
          "Dean's List",
          "Computer Science Club President"
        ]

  ResumeProject:
    type: object
    required: [project, date, descriptions]
    properties:
      project:
        type: string
        description: "Project name or title"
        examples: ["E-commerce Platform", "Machine Learning Model", "Mobile App"]
      date:
        type: string
        description: "Project timeline"
        examples: ["2023", "Jan-Mar 2023", "Summer 2022"]
      descriptions:
        type: array
        items:
          type: string
        description: "Project details and outcomes"
        examples: [
          "Built full-stack web application using MERN stack",
          "Implemented user authentication and payment processing",
          "Deployed on AWS with 99.9% uptime"
        ]

  ResumeSkills:
    type: object
    required: [featuredSkills, descriptions]
    properties:
      featuredSkills:
        type: array
        maxItems: 6
        items:
          $ref: "#/definitions/FeaturedSkill"
        description: "Up to 6 featured skills with ratings"
      descriptions:
        type: array
        items:
          type: string
        description: "Additional skills and technologies"
        examples: [
          "JavaScript, Python, React, Node.js",
          "AWS, Docker, Kubernetes, Git",
          "Machine Learning, Data Analysis"
        ]

  FeaturedSkill:
    type: object
    required: [skill, rating]
    properties:
      skill:
        type: string
        description: "Skill name"
        examples: ["JavaScript", "Python", "Project Management"]
      rating:
        type: integer
        minimum: 1
        maximum: 5
        default: 4
        description: "Skill proficiency rating (1-5 scale)"

  ResumeCustom:
    type: object
    required: [descriptions]
    properties:
      title:
        type: string
        description: "Custom section heading"
        default: "CUSTOM SECTION"
        examples: ["Key Achievements", "Awards & Honors", "Certifications", "Publications"]
      descriptions:
        type: array
        items:
          type: string
        description: "Custom section content"
        default: []

additionalProperties: false